name: SynaptoRoute CI Pipeline

on:
  push:
    branches: [ main, "codex/**" ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Static Quality and Package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install quality dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]"

    - name: Run static checks
      run: |
        ruff check src/ tests/ benchmarks/ paper/
        mypy src/synaptoroute

    - name: Run artifact preflight
      run: |
        python paper/preflight.py

    - name: Build and install wheel
      run: |
        python -m build
        python -m venv .wheel-smoke
        .wheel-smoke/bin/python -m pip install dist/*.whl
        .wheel-smoke/bin/python -c "import synaptoroute; print(synaptoroute.__version__)"

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]"

    - name: Run Pytest Suite
      run: |
        python -m pytest tests -m "not model" -q

    - name: Run Unverified Structural Smoke
      run: |
        python benchmarks/run_ci_smoke_benchmark.py --output-dir benchmark_results/ci_smoke

    - name: Upload Structural Smoke Evidence
      uses: actions/upload-artifact@v4
      with:
        name: structural-smoke-${{ matrix.os }}-py${{ matrix.python-version }}
        path: benchmark_results/ci_smoke/

  model-integration:
    name: FastEmbed Model Integration (Linux, Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Load and exercise the pinned paper encoder
      env:
        SYNAPTOROUTE_RUN_MODEL_TESTS: "1"
      run: |
        python -m pytest tests/integration/test_fastembed_model.py -m model -q
