name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,all]
          
      - name: Run Tests
        run: |
          pip install pytest-timeout
          pytest tests/ -v -s --timeout=30
          
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Docker Image
        run: |
          docker build -t synaptoroute-test .

  benchmark:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]
          
      - name: Run Real-World Dataset Benchmark
        run: |
          pip install datasets
          echo "### System Performance & Real Datasets" >> $GITHUB_STEP_SUMMARY
          python benchmarks/bench_realworld.py >> $GITHUB_STEP_SUMMARY
