name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run linters
        run: |
          ruff check src/ tests/ benchmarks/
          mypy --ignore-missing-imports src/

      - name: Run tests
        run: pytest tests/ -v -s --timeout=30

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t synaptoroute-test .

  benchmark-evidence:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run deterministic evidence smoke benchmark
        run: |
          python benchmarks/run_all_benchmarks.py --benchmarks local_smoke --output-dir benchmark_results
          python -m pytest tests/test_benchmark_evidence.py tests/test_benchmark_methodology.py -q

      - name: Archive benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence-smoke
          path: benchmark_results/
          if-no-files-found: error
