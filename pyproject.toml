[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synaptoroute"
version = "0.5.0"
requires-python = ">=3.10"
description = "A high-throughput semantic routing engine for AI agents and LLM applications."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sitanshu Kumar", email = "sitanshukumar65@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "fastembed>=0.8.0",
    "scikit-learn>=1.0.0"
]

[project.urls]
Repository = "https://github.com/sitanshukr08/SynaptoRoute"
Issues = "https://github.com/sitanshukr08/SynaptoRoute/issues"

[project.scripts]
synaptoroute = "synaptoroute.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]
benchmark = [
    "datasets>=3.0.0,<5.0.0",
    "psutil>=5.9.0",
    "scipy>=1.10.0",
    "semantic-router>=0.1.15,<0.2.0"
]
dev = [
    "build>=1.2.0",
    "datasets>=3.0.0,<5.0.0",
    "mypy>=1.0.0",
    "psutil>=5.9.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.1.0",
    "scipy>=1.10.0",
    "semantic-router>=0.1.15,<0.2.0"
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]
openai = ["openai>=1.40.0"]
metrics = ["prometheus-client>=0.19.0"]
redis = ["redis>=5.0.0"]
faiss = ["faiss-cpu>=1.8.0"]
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
rerank = ["sentence-transformers>=2.2.0"]
lexicon = ["rank-bm25>=0.2.2"]
all = [
    "fastapi>=0.100.0", "uvicorn>=0.22.0",
    "openai>=1.40.0", "prometheus-client>=0.19.0", "redis>=5.0.0", "faiss-cpu>=1.8.0",
    "langchain-core>=0.1.0", "llama-index-core>=0.10.0", "sentence-transformers>=2.2.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/synaptoroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
